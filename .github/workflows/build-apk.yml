name: Build arm64 APK

# Manual trigger only — this is a sideload build for testing on a Pixel 10
# (arm64-v8a), not a release pipeline. No push/PR triggers on purpose.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - profile
          - debug
      dev_tools:
        description: "Include developer tools (chart calibration capture). Default: only in debug/profile builds"
        type: boolean
        required: false
        default: false
      build_aab:
        description: "Also build the signed Play Store bundle (.aab) next to the APK (needs the 4 VESPER_UPLOAD_* secrets, docs/PLAY_RELEASE.md)"
        type: boolean
        required: false
        default: false
      flutter_version:
        description: "Flutter version (blank = latest stable)"
        type: string
        required: false
        default: ""

permissions:
  contents: write # needed to publish the GitHub Release below

jobs:
  build:
    name: Build arm64-v8a ${{ inputs.build_mode }} APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a working Android SDK
      # (cmdline-tools + platform-tools) at $ANDROID_HOME — no separate
      # setup action needed. (android-actions/setup-android@v3 was tried
      # here first and fails outright: it runs `sdkmanager tools`, and
      # Google removed that legacy standalone "tools" package from the SDK
      # repository years ago, so the action exits 1 before anything else
      # runs.) Just accept licenses against the preinstalled SDK; the exact
      # NDK (flutter.ndkVersion) and CMake (3.22.1, pinned in
      # android/app/src/main/cpp/CMakeLists.txt) versions the native build
      # needs are auto-downloaded by the Android Gradle Plugin itself
      # during the build.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Pre-install the pinned CMake (android/app/src/main/cpp/CMakeLists.txt)
      # with retries. Letting Gradle auto-download it mid-build failed once with
      # a truncated download ("Archive is not a ZIP archive"), killing the run.
      - name: Install CMake 3.22.1 (with retries)
        run: |
          for i in 1 2 3 4; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" && exit 0
            echo "sdkmanager failed (attempt $i), removing partial download and retrying..."
            rm -rf "$ANDROID_HOME/cmake/3.22.1" "$ANDROID_HOME/.temp"
            sleep $((i * 5))
          done
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '' }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      # Optional: the Firebase config as a secret instead of a committed file
      # (android/app/google-services.json holds a placeholder until replaced).
      - name: Firebase config from secret (if set)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; fi

      - name: flutter doctor
        run: flutter doctor -v

      # arm64-v8a only (Pixel 10 / Tensor G5): --target-platform android-arm64
      # alone restricts what's actually compiled/bundled to arm64-v8a, which
      # is what keeps the APK small. NOT using --split-per-abi here: that
      # configures Gradle's `splits.abi` block to just arm64-v8a, but
      # android/app/build.gradle.kts's own `ndk.abiFilters` still lists both
      # arm64-v8a and x86_64 (kept for local dev builds) — AGP refuses to
      # have ndk.abiFilters list more ABIs than splits.abi does
      # ("Conflicting configuration ... cannot be present when splits abi
      # filters are set"), so the two flags fight. --target-platform alone
      # already does everything --split-per-abi would add here, since only
      # one platform is ever requested.
      #
      # Release mode also gets Flutter/R8's default code shrinking, resource
      # shrinking, and tree-shaken icon fonts for free.
      - name: Build APK (arm64-v8a, ${{ inputs.build_mode }})
        env:
          VESPER_ADMOB_APP_ID: ${{ vars.VESPER_ADMOB_APP_ID }}
        run: |
          DEV_FLAG=""
          if [ -n "${{ vars.VESPER_REWARDED_AD_UNIT }}" ]; then DEV_FLAG="--dart-define=VESPER_REWARDED_AD_UNIT=${{ vars.VESPER_REWARDED_AD_UNIT }}"; fi
          if [ "${{ inputs.dev_tools }}" = "true" ]; then DEV_FLAG="$DEV_FLAG --dart-define=VESPER_DEV_TOOLS=true"; fi
          flutter build apk \
            --${{ inputs.build_mode }} \
            --target-platform android-arm64 \
            $DEV_FLAG

      # pubspec.yaml's version line (e.g. "version: 0.2.20+22") is the single
      # source of truth for both versionName and versionCode that Flutter
      # itself feeds into the built APK, so the release/asset name is
      # derived from the same line rather than duplicated anywhere.
      - name: Read app version
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "name=${RAW%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${RAW#*+}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: apk
        run: |
          SRC="build/app/outputs/flutter-apk/app-${{ inputs.build_mode }}.apk"
          NAME="vesper-cine-v${{ steps.version.outputs.name }}-${{ inputs.build_mode }}.apk"
          DEST="build/app/outputs/flutter-apk/$NAME"
          mv "$SRC" "$DEST"
          ls -lh "$DEST"
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$NAME\`: $(du -h "$DEST" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Published as a GitHub Release rather than a workflow artifact so the
      # APK downloads as a plain .apk file with no zip wrapper. release
      # builds publish as a normal (non-prerelease) release; debug/profile
      # builds are marked prerelease since they're sideload/test builds, not
      # something meant to look like a finished build.
      - name: Determine prerelease flag
        id: prerelease
        run: |
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ inputs.build_mode }}-${{ github.run_number }}
          name: "Vesper Cine v${{ steps.version.outputs.name }} (${{ inputs.build_mode }})"
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Manually triggered build from commit ${{ github.sha }}.
            Build mode: `${{ inputs.build_mode }}` · arm64-v8a only.

  # Play Store bundle, built next to the APK when the build_aab box is ticked. Signed with the private upload key from the repository
  # secrets (never committed). The .aab is published on the Releases page (pre-release):
  # download it there and upload it to Play Console. Always release mode, no developer tools.
  bundle:
    name: Build Play Store bundle (.aab)
    if: ${{ inputs.build_aab }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the upload key secrets exist
        env:
          KS: ${{ secrets.VESPER_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.VESPER_UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.VESPER_UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.VESPER_UPLOAD_KEY_PASSWORD }}
        run: |
          for v in KS SP KA KP; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is missing - see docs/PLAY_RELEASE.md section 2. (The APK build is not affected.)"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install CMake 3.22.1 (with retries)
        run: |
          for i in 1 2 3 4; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" && exit 0
            echo "sdkmanager failed (attempt $i), removing partial download and retrying..."
            rm -rf "$ANDROID_HOME/cmake/3.22.1" "$ANDROID_HOME/.temp"
            sleep $((i * 5))
          done
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '' }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      # Optional: the Firebase config as a secret instead of a committed file
      # (android/app/google-services.json holds a placeholder until replaced).
      - name: Firebase config from secret (if set)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; fi

      - name: Write the upload keystore (runner only, deleted with the runner)
        env:
          KS: ${{ secrets.VESPER_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "VESPER_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build app bundle (arm64-v8a, release)
        env:
          VESPER_UPLOAD_STORE_PASSWORD: ${{ secrets.VESPER_UPLOAD_STORE_PASSWORD }}
          VESPER_UPLOAD_KEY_ALIAS: ${{ secrets.VESPER_UPLOAD_KEY_ALIAS }}
          VESPER_UPLOAD_KEY_PASSWORD: ${{ secrets.VESPER_UPLOAD_KEY_PASSWORD }}
          VESPER_ADMOB_APP_ID: ${{ vars.VESPER_ADMOB_APP_ID }}
        run: |
          AD_FLAG=""
          if [ -n "${{ vars.VESPER_REWARDED_AD_UNIT }}" ]; then AD_FLAG="--dart-define=VESPER_REWARDED_AD_UNIT=${{ vars.VESPER_REWARDED_AD_UNIT }}"; fi
          if [ -z "$VESPER_ADMOB_APP_ID" ] || [ -z "${{ vars.VESPER_REWARDED_AD_UNIT }}" ]; then
            echo "::warning::AdMob IDs not set (repository variables VESPER_ADMOB_APP_ID / VESPER_REWARDED_AD_UNIT): this bundle shows Google TEST ads. Fine for the closed test, not for production."
          fi
          flutter build appbundle --release --target-platform android-arm64 $AD_FLAG

      - name: Name the bundle and show its signing certificate
        id: aab
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "ver=${RAW%+*}" >> "$GITHUB_OUTPUT"
          NAME="vesper-cine-v${RAW%+*}-build${RAW#*+}.aab"
          mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=build/app/outputs/bundle/release/$NAME" >> "$GITHUB_OUTPUT"
          # The fingerprint is public information (it is what Play shows); it
          # lets you check the bundle was signed with the upload key.
          keytool -printcert -jarfile "build/app/outputs/bundle/release/$NAME" | grep -E 'Owner|SHA256' | tee -a "$GITHUB_STEP_SUMMARY"

      # Published on the Releases page (like the APK) so it downloads as a plain
      # .aab. Marked prerelease so it never looks like the "latest" app download.
      - name: Publish GitHub Release (bundle)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.aab.outputs.ver }}-bundle-${{ github.run_number }}
          name: "Vesper Cine v${{ steps.aab.outputs.ver }} (Play bundle)"
          prerelease: true
          files: ${{ steps.aab.outputs.path }}
          body: |
            Play Store app bundle (.aab) from commit ${{ github.sha }}, signed with the upload key.
            Upload it in Play Console; it is not installable on a phone directly.
