name: Build arm64 APK

# Manual trigger only — this is a sideload build for testing on a Pixel 10
# (arm64-v8a), not a release pipeline. No push/PR triggers on purpose.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - profile
          - debug
      flutter_version:
        description: "Flutter version (blank = latest stable)"
        type: string
        required: false
        default: ""

jobs:
  build:
    name: Build arm64-v8a ${{ inputs.build_mode }} APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the Android SDK cmdline-tools and accepts licenses. The
      # exact NDK (flutter.ndkVersion) and CMake (3.22.1, pinned in
      # android/app/src/main/cpp/CMakeLists.txt) versions the native build
      # needs are then auto-downloaded by the Android Gradle Plugin itself
      # during the build — they don't need to be pre-installed here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '' }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter doctor
        run: flutter doctor -v

      # arm64-v8a only (Pixel 10 / Tensor G5), single-ABI so nothing for
      # x86_64 gets built or bundled — this is what actually keeps the APK
      # small; --split-per-abi just makes the output filename explicit.
      # Release mode also gets Flutter/R8's default code shrinking,
      # resource shrinking and tree-shaken icon fonts for free.
      - name: Build APK (arm64-v8a, ${{ inputs.build_mode }})
        run: |
          flutter build apk \
            --${{ inputs.build_mode }} \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Report APK size
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          ls -lh "$APK_DIR"
          echo "### APK size" >> "$GITHUB_STEP_SUMMARY"
          for f in "$APK_DIR"/*.apk; do
            printf -- '- `%s`: %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesper-cine-arm64-${{ inputs.build_mode }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-${{ inputs.build_mode }}.apk
          if-no-files-found: error
          retention-days: 30
