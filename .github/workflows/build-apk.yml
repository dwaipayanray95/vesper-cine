name: Build arm64 APK

# Manual trigger only — this is a sideload build for testing on a Pixel 10
# (arm64-v8a), not a release pipeline. No push/PR triggers on purpose.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - profile
          - debug
      flutter_version:
        description: "Flutter version (blank = latest stable)"
        type: string
        required: false
        default: ""

permissions:
  contents: write # needed to publish the GitHub Release below

jobs:
  build:
    name: Build arm64-v8a ${{ inputs.build_mode }} APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a working Android SDK
      # (cmdline-tools + platform-tools) at $ANDROID_HOME — no separate
      # setup action needed. (android-actions/setup-android@v3 was tried
      # here first and fails outright: it runs `sdkmanager tools`, and
      # Google removed that legacy standalone "tools" package from the SDK
      # repository years ago, so the action exits 1 before anything else
      # runs.) Just accept licenses against the preinstalled SDK; the exact
      # NDK (flutter.ndkVersion) and CMake (3.22.1, pinned in
      # android/app/src/main/cpp/CMakeLists.txt) versions the native build
      # needs are auto-downloaded by the Android Gradle Plugin itself
      # during the build.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '' }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter doctor
        run: flutter doctor -v

      # arm64-v8a only (Pixel 10 / Tensor G5): --target-platform android-arm64
      # alone restricts what's actually compiled/bundled to arm64-v8a, which
      # is what keeps the APK small. NOT using --split-per-abi here: that
      # configures Gradle's `splits.abi` block to just arm64-v8a, but
      # android/app/build.gradle.kts's own `ndk.abiFilters` still lists both
      # arm64-v8a and x86_64 (kept for local dev builds) — AGP refuses to
      # have ndk.abiFilters list more ABIs than splits.abi does
      # ("Conflicting configuration ... cannot be present when splits abi
      # filters are set"), so the two flags fight. --target-platform alone
      # already does everything --split-per-abi would add here, since only
      # one platform is ever requested.
      #
      # Release mode also gets Flutter/R8's default code shrinking, resource
      # shrinking, and tree-shaken icon fonts for free.
      - name: Build APK (arm64-v8a, ${{ inputs.build_mode }})
        run: |
          flutter build apk \
            --${{ inputs.build_mode }} \
            --target-platform android-arm64

      # pubspec.yaml's version line (e.g. "version: 0.2.20+22") is the single
      # source of truth for both versionName and versionCode that Flutter
      # itself feeds into the built APK, so the release/asset name is
      # derived from the same line rather than duplicated anywhere.
      - name: Read app version
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "name=${RAW%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${RAW#*+}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: apk
        run: |
          SRC="build/app/outputs/flutter-apk/app-${{ inputs.build_mode }}.apk"
          NAME="vesper-cine-v${{ steps.version.outputs.name }}-${{ inputs.build_mode }}.apk"
          DEST="build/app/outputs/flutter-apk/$NAME"
          mv "$SRC" "$DEST"
          ls -lh "$DEST"
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$NAME\`: $(du -h "$DEST" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Published as a GitHub Release rather than a workflow artifact so the
      # APK downloads as a plain .apk file with no zip wrapper. release
      # builds publish as a normal (non-prerelease) release; debug/profile
      # builds are marked prerelease since they're sideload/test builds, not
      # something meant to look like a finished build.
      - name: Determine prerelease flag
        id: prerelease
        run: |
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ inputs.build_mode }}-${{ github.run_number }}
          name: "Vesper Cine v${{ steps.version.outputs.name }} (${{ inputs.build_mode }})"
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Manually triggered build from commit ${{ github.sha }}.
            Build mode: `${{ inputs.build_mode }}` · arm64-v8a only.
